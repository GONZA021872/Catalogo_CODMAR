<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

  <title>Catalogo CO D MAR </title>

<style>

/* ========================= */
/*          CSS CODMAR        */
/* ========================= */


body {
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f5f5f5;
}

/* MARCA CODMAR */

.marca{
    text-align:center;
    margin-top:20px;
}

.logo-icono{
    font-size:48px;
    margin-bottom:5px;
}

.marca h1{
    font-size:80px;
    font-weight:900;
    margin:0;
    letter-spacing:4px;
    color:#111;
}

.marca p{
    font-size: 40px;          /* Más grande */
    font-weight: bold;
    color: #555;
    margin-top: 5px;
    margin-bottom: 20px;
    letter-spacing: 2px;      /* Más separación entre letras */
    line-height: 1.4;         /* Hace que la letra se vea más alta */
    text-transform: uppercase;/* Todo en mayúsculas, más profesional */
}


/* BUSCADOR */

#buscar{
    width:90%;
    max-width:700px;
    display:block;
    margin:20px auto;
    padding:18px 20px;
    font-size:28px;
    border:2px solid #ccc;
    border-radius:12px;
    outline:none;
}
/* CATALOGO */

#catalogo{
    text-align:center;
}


.producto{
    border:1px solid #ccc;
    background:white;
    border-radius:10px;
    padding:8px;
    margin:8px;
    width:160px;
    display:inline-block;
    text-align:center;
    vertical-align:top;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.producto img{
    width:110px;
    height:110px;
    object-fit:contain;

}

.producto h3{
    font-size:14px;
    margin:6px 0;
    min-height:36px;
}

.producto p{
    font-size:18px;
    color:#d32f2f;
    font-weight:bold;
    margin:6px 0;
}




/* BOTON AGREGAR CARRITO */

.boton-carrito{
    display:block;
    width:110%;
    margin-top:6px;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    font-size:18px;
    cursor:pointer;
}



/* BOTON CARRITO PRINCIPAL */

#verCarrito{
    display:block;
    width:40%;
    margin:25px auto;
    height:100px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:15px;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

#verCarrito:hover{
    transform:scale(1.05);
    background:#f57c00;
}

/* VENTANA DEL CARRITO */

#carritoVentana{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:420px;
    max-height:500px;
    overflow-y:auto;
    background:#fff;
    border-radius:10px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
    z-index:9999;
}



#listaCarrito{
    margin-top:15px;
}



#totalCarrito{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
    color:#d32f2f;
}



/* BOTONES DEL CARRITO */

.botonesCarrito{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}


.botonesCarrito button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}



#vaciarCarrito{
    background:#d32f2f;
    color:white;
}



#enviarWhatsApp{
    background:#25D366;
    color:white;
}



#cerrarCarrito{
    background:#666;
    color:white;
}



#carritoVentana button{
    margin:5px;
}

#volverCatalogo{
    display:none;
    width:60%;
    max-width:500px;
    margin:20px auto;
    padding:18px 25px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:12px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}


#volverCatalogo:hover{
    background:#0b5ed7;
}



/* ===== MODAL PRODUCTO ===== */

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.7);
}

.modal-contenido{

    background:white;

    width:90%;
    max-width:420px;

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    border-radius:15px;

    padding:20px;

    text-align:center;

    animation:aparecer .25s;
}

.modal-contenido img{

    width:420px;

    height:420px;

    object-fit:contain;

}

#modalNombre{

    font-size:24px;
    margin:15px 0;

}

#modalPrecio{

    font-size:26px;

    color:#e53935;

    font-weight:bold;

}

#agregarModal{

    background:#28a745;

    color:white;

    border:none;

    padding:15px 25px;

    border-radius:10px;

    font-size:18px;

    cursor:pointer;

}

#cerrarModal{

    position:absolute;
    right:15px;
    top:10px;
    font-size:35px;
    cursor:pointer;

}



/* CATEGORÍAS */

.categorias{

    display:flex;
    flex-wrap:nowrap;
    justify-content:flex-start;
    gap:12px;
    width:100%;
    margin:20px auto;
    padding:0 10px;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;

}


.categorias::-webkit-scrollbar{

    display:none;

}


.categorias button{

    flex:0 0 auto;
    min-width:200px;
    height:85px;
    padding:0 30px;
    font-size:20px;
    border-radius:12px;
    background:#0d6efd;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

}



/* ========================= */
/*      PÁGINA CARRITO        */
/* ========================= */

.categorias button:hover{

    background:#0b5ed7;

}



/* CELULAR */

@media (max-width:768px){

 .categorias{

    display:flex;
    flex-direction:row;
    flex-wrap:nowrap;
    gap:12px;
    width:100%;
    margin:20px auto;
    padding:25px 10px;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    -webkit-overflow-scrolling:touch;

}


    .categorias::-webkit-scrollbar{

        display:none;

    }


    .categorias button{

    flex:0 0 auto;
    min-width:200px;
    height:60px;
    padding:0 30px;
    font-size:20px;
    border-radius:12px;
    background:#0d6efd;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

}

}

/* ========================= */
/*      PÁGINA CARRITO        */
/* ========================= */

#paginaCarrito{

    display:none;
    width:95%;
    max-width:900px;
    margin:20px auto;
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);

}

.productoCarrito{

    display:flex;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #ddd;
    padding:15px 0;

}

.productoCarrito img{

    width:90px;
    height:90px;
    object-fit:contain;

}

.infoProducto{

    flex:1;

}

.infoProducto h3{

    margin:0;
    font-size:20px;

}

.infoProducto p{

    margin:8px 0;
    color:#d32f2f;
    font-weight:bold;
    font-size:20px;

}


.filaCarrito{

    display:grid;
    grid-template-columns:140px 1fr 100px 120px 70px;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #ddd;
    padding:12px 0;

}

.colImagen{

    width:70px;
    flex-shrink:0;

}

.colImagen img{

    width:60px;
    height:60px;
    object-fit:contain;
    display:block;

}

.colCantidad{

    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;

}

.colCantidad span{

    font-size:18px;
    font-weight:bold;

}

.colCantidad button{

    width:30px;
    height:30px;
    cursor:pointer;

}

.colProducto{

    font-weight:bold;

}

.colPrecio,
.colImporte{

    text-align:center;
    font-weight:bold;

}

.colImporte{

    color:#d32f2f;

}

.colEliminar{

    text-align:center;

}

.colEliminar button{

    background:#d32f2f;
    color:white;
    border:none;
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;

}


.encabezadoCarrito{

    display:grid;
    grid-template-columns:140px 1fr 100px 120px 70px;
    gap:10px;
    font-weight:bold;
    background:#0d6efd;
    color:white;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    text-align:center;

}

    /* CARRITO EN CELULAR */

#carritoVentana{

    width:90%;
    max-width:500px;
    max-height:80vh;
    padding:25px;
    border-radius:15px;

}


#carritoVentana h2{

    font-size:32px;

}


#listaCarrito{

    font-size:22px;

}


#totalCarrito{

    font-size:28px;

}


.botonesCarrito{

    flex-direction:column;
    gap:15px;

}


.botonesCarrito button{

    width:100%;
    padding:18px;
    font-size:22px;

}




</style>

</head>

<body>


    <div class="marca">
    
     <h1>CO D MAR</h1>

    <p>Distribuidora Farmacéutica y Comercializadora</p>
   </div>


<!-- Categorías -->

<div class="categorias">

    <button onclick="mostrarMedicamentos()">
        💊 Medicamentos
    </button>

    <button onclick="mostrarMaterial()">
        🩹 Material de Curación
    </button>

    <button onclick="mostrarPerfumeria()">
    🧴 Perfumería
    </button>


    <button onclick="mostrarMiscelaneos()">
    📦 Misceláneos
    </button>

    <button onclick="mostrarSimilares()">
        🔄 Similares
    </button>

    <button onclick="mostrarPatente()">
        💎 Patente
    </button>

    
</div>



<!-- Buscador de productos -->

<input 
type="text"
id="buscar"
placeholder="🔍 Buscar producto...">


<button id="volverCatalogo">
    ← Volver al catálogo
</button>


<!-- Botón para abrir carrito -->

<button id="verCarrito" onclick="verCarrito()">

🛒 Carrito (0)

</button>


<!-- Aquí aparecerán los productos del catálogo -->

<div id="catalogo"></div>


<!-- ========================= -->
<!--       VENTANA CARRITO      -->
<!-- ========================= -->


<div id="carritoVentana" style="display:none;">


    <h2>🛒 Mi carrito</h2>


    <div id="listaCarrito"></div>


    <h3 id="totalCarrito"></h3>



    <div class="botonesCarrito">


        <button 
        id="vaciarCarrito"
        onclick="vaciarCarrito()">

            🗑 Vaciar carrito

        </button>



        <button
        id="enviarWhatsApp"
        onclick="enviarWhatsApp()">

            📲 Enviar pedido

        </button>



        <button
        id="cerrarCarrito"
        onclick="cerrarCarrito()">

            ❌ Cerrar

        </button>


    </div>


</div>


<!-- ========================= -->
<!--       PÁGINA CLIENTES     -->
<!-- ========================= -->

<div id="paginaClientes" style="display:none;">

    <h2 style="text-align:center; font-size:32px;">
        👥 Mis Clientes
    </h2>

    <div style="text-align:center; margin-top:30px;">

        <button id="agregarCliente">
            ➕ Agregar cliente
        </button>

        <button id="volverCarritoClientes">
            ⬅ Volver al carrito
        </button>

    </div>

    <!-- FORMULARIO AGREGAR CLIENTE -->

    <div id="formularioCliente" style="display:none; margin:30px auto; max-width:500px;">

        <h3 style="text-align:center;">
            ➕ Agregar cliente
        </h3>

        <label>
            Nombre del cliente
        </label>

        <input
            type="text"
            id="nombreCliente"

        </label>

        <input
            type="tel"
            id="whatsappCliente"
            placeholder="Ejemplo: 2281234567"

        <div style="text-align:center;">

            <button id="guardarCliente">
                💾 Guardar
            </button>

            <button id="cancelarCliente">
                ❌ Cancelar
            </button>

        </div>

    </div>

    <!-- LISTA DE CLIENTES -->

    <div id="listaClientes"></div>

</div>


<!-- ===== VENTANA DEL PRODUCTO ===== -->

<div id="modalProducto" class="modal">

    <div class="modal-contenido">

        <span id="cerrarModal">&times;</span>

        <img id="modalImagen" src="" alt="Producto">

        <h2 id="modalNombre"></h2>

        <p id="modalPrecio"></p>

        <button id="agregarModal">

            🛒 Agregar al carrito

        </button>

    </div>

</div>


<!-- ========================= -->
<!--       PÁGINA CARRITO     -->
<!-- ========================= -->

<div id="paginaCarrito" style="display:none;">

    <h2 style="text-align:center; font-size:32px;">
        🛒 Mi Carrito
    </h2>

    <div id="clienteSeleccionadoCarrito"
        style="
            text-align:center;
            margin:15px auto;
            padding:12px;
            max-width:600px;
            background:#e8f1ff;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
        ">
    </div>

    <div id="listaCarritoPagina"></div>

    <h2 id="totalPagina"
        style="text-align:center; color:#d32f2f;">
    </h2>

    <div style="text-align:center; margin-top:30px;">

        <button id="enviarWhatsAppPagina">
            📲 Enviar pedido
        </button>

        <button id="verClientes" onclick="verClientes()">
            👥 Clientes
        </button>

        <button id="vaciarCarritoPagina">
            🗑 Vaciar carrito
        </button>

        <button id="volverCatalogoPagina">
            ⬅ Volver al catálogo
        </button>

    </div>

</div>





<script>



// =========================
//       JAVASCRIPT CODMAR
// =========================




// =========================
//       CARRITO
// =========================

let carrito = JSON.parse(localStorage.getItem("carrito")) || [];


// Actualiza el número del botón carrito

function actualizarCarrito(){

    document.getElementById("verCarrito").innerHTML =
    "🛒 Carrito (" + carrito.length + ")";
    localStorage.setItem("carrito", JSON.stringify(carrito));

}



// Agregar productos

function agregarCarrito(nombre, precio, imagen){


    precio = parseFloat(precio.replace("$","").trim());


    let productoExistente = carrito.find(function(producto){

        return producto.nombre === nombre;

    });



    if(productoExistente){


        productoExistente.cantidad++;


    }else{


     carrito.push({

    nombre:nombre,
    precio:precio,
    cantidad:1,
    imagen:imagen


});

    }



    actualizarCarrito();



    alert(
        nombre +
        " agregado al carrito.\n\nProductos en el carrito: "
        + carrito.length
    );


}



// Mostrar carrito

function verCarrito(){

    // Ocultar catálogo
    document.getElementById("catalogo").style.display = "none";

    // Ocultar botón del carrito
    document.getElementById("verCarrito").style.display = "none";

    // Mostrar página del carrito
    document.getElementById("paginaCarrito").style.display = "block";


// Mostrar cliente seleccionado
let clienteSeleccionado =
    JSON.parse(localStorage.getItem("clienteSeleccionadoCODMAR"));

let cajaCliente =
document.getElementById("clienteSeleccionadoCarrito");

if(cajaCliente){

    if(clienteSeleccionado){

        cajaCliente.innerHTML =
            "👤 Cliente: " + clienteSeleccionado.nombre +
            "<br>📱 WhatsApp: " + clienteSeleccionado.whatsapp;

    }else{

        cajaCliente.innerHTML =
            "👤 Ningún cliente seleccionado";

    }

}


    let contenido = "";
    let total = 0;

    carrito.forEach(function(producto){

        contenido += `

<div class="filaCarrito">

    <div class="colCantidad">
        <button onclick="disminuirCantidad('${producto.nombre}')">➖</button>
        <span>${producto.cantidad}</span>
        <button onclick="aumentarCantidad('${producto.nombre}')">➕</button>
    </div>

    <div class="colProducto">
        ${producto.nombre}
    </div>

    <div class="colPrecio">
        $${producto.precio.toFixed(2)}
    </div>

    <div class="colImporte">
        $${(producto.precio * producto.cantidad).toFixed(2)}
    </div>

    <div class="colEliminar">
        <button onclick="eliminarProducto('${producto.nombre}')">🗑</button>
    </div>

</div>

`;

        total += producto.precio * producto.cantidad;

    });

    if(carrito.length === 0){

        document.getElementById("listaCarritoPagina").innerHTML =
        "<h3 style='text-align:center;'>🛒 El carrito está vacío</h3>";

        document.getElementById("totalPagina").innerHTML = "";

    }else{

        document.getElementById("listaCarritoPagina").innerHTML =

        `

<div class="encabezadoCarrito">

    <div>Cantidad</div>
    <div>Producto</div>
    <div>Precio</div>
    <div>Importe</div>
    <div></div>

</div>

` + contenido;

        document.getElementById("totalPagina").innerHTML =
        "TOTAL: $" + total.toLocaleString("es-MX",{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });

    }

}



// Aumentar cantidad

function aumentarCantidad(nombre){


    let producto = carrito.find(p => p.nombre === nombre);


    producto.cantidad++;


    verCarrito();

    actualizarCarrito();


}



// Disminuir cantidad

function disminuirCantidad(nombre){


    let producto = carrito.find(p => p.nombre === nombre);



    if(producto.cantidad > 1){


        producto.cantidad--;


    }else{


        eliminarProducto(nombre);


    }



    verCarrito();

    actualizarCarrito();


}




// Eliminar producto

function eliminarProducto(nombre){


    carrito = carrito.filter(p => p.nombre !== nombre);



    verCarrito();

    actualizarCarrito();


}


// Vaciar carrito

function vaciarCarrito(){

    carrito = [];

    actualizarCarrito();

    verCarrito();

}


// Cerrar carrito

function cerrarCarrito(){


    document.getElementById("carritoVentana").style.display="none";


}

// =========================
//   ENVIAR PEDIDO WHATSAPP
// =========================

function enviarWhatsApp(){

    if(carrito.length === 0){

        alert("El carrito está vacío.");

        return;
    }

    let clienteSeleccionado =
        JSON.parse(localStorage.getItem("clienteSeleccionadoCODMAR"));

    if(!clienteSeleccionado){

        alert("Primero selecciona un cliente.");

        return;
    }

    let numeroCliente = "";

    if(clienteSeleccionado.whatsapp){

        numeroCliente =
            clienteSeleccionado.whatsapp.replace(/\D/g, "");

    }

    let mensaje = "";

    mensaje += "🏥 *CODMAR*\n";
    mensaje += "Distribuidora Farmacéutica y Comercializadora\n\n";

      mensaje += "👤 Cliente: " +
    clienteSeleccionado.nombre + "\n\n";

    mensaje += "```text\n";

    mensaje += "Cant  Artículo              P.Unit      Importe\n";

    mensaje += "----------------------------------------------------\n";

    let total = 0;

    carrito.forEach(function(producto){

        let subtotal =
            producto.precio * producto.cantidad;

        let cantidad =
            String(producto.cantidad).padEnd(5);

        let articulo =
            producto.nombre.substring(0,22).padEnd(22);

        let precioUnitario =
            "$" + producto.precio.toLocaleString("es-MX",{
                minimumFractionDigits:2,
                maximumFractionDigits:2
            });

        let importe =
            "$" + subtotal.toLocaleString("es-MX",{
                minimumFractionDigits:2,
                maximumFractionDigits:2
            });

        mensaje +=
            cantidad +
            articulo +
            precioUnitario.padStart(10) +
            importe.padStart(12) +
            "\n";

        total += subtotal;

    });

    mensaje +=
        "----------------------------------------------------\n";

    mensaje +=
        "TOTAL: $" +
        total.toLocaleString("es-MX",{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }) +
        "\n";

    mensaje += "```";

    let enlaceWhatsApp =
    "https://wa.me/?text=" +
    encodeURIComponent(mensaje);

window.open(enlaceWhatsApp, "_blank");

}




// =========================
//      MODAL PRODUCTO
// =========================

let productoModal = null;

function abrirProducto(imagen, nombre, precio){

    productoModal = {
        imagen: imagen,
        nombre: nombre,
        precio: precio
    };

    document.getElementById("modalImagen").src =
    "imagenes/" + imagen;

    document.getElementById("modalNombre").innerHTML =
    nombre;

    document.getElementById("modalPrecio").innerHTML =
    "$" + precio;

    document.getElementById("modalProducto").style.display =
    "block";

}

document.getElementById("cerrarModal").onclick = function(){

    document.getElementById("modalProducto").style.display =
    "none";

};

window.onclick = function(event){

    if(event.target == document.getElementById("modalProducto")){

        document.getElementById("modalProducto").style.display =
        "none";

    }

};



document.getElementById("agregarModal").onclick = function(){

    agregarCarrito(
        productoModal.nombre,
        productoModal.precio,
        productoModal.imagen
    );

    document.getElementById("modalProducto").style.display =
    "none";

};



// =========================
//       CARGAR CSV
// =========================


fetch("productos.csv")


.then(respuesta => respuesta.text())


.then(datos => {



const filas = datos.split("\n");


const catalogo = document.getElementById("catalogo");


const buscar = document.getElementById("buscar");


const volverCatalogo = document.getElementById("volverCatalogo");



window.productos = [];



for(let i=1;i<filas.length;i++){



    let columnas = filas[i].split(",");



    if(columnas.length>=4){



       window.productos.push({


            imagen:columnas[0].trim(),


            nombre:columnas[1].trim(),


            precio:columnas[2].trim(),

            categoria:columnas[3].trim(),



        });



    }



}




function mostrarProductos(lista){

    catalogo.innerHTML="";

    lista.forEach(producto=>{

        catalogo.innerHTML += `

        <div class="producto">

        <img
        src="imagenes/${producto.imagen}"
        onclick="abrirProducto(
        '${producto.imagen}',
        '${producto.nombre}',
        '${producto.precio}'
        )"
        style="cursor:pointer;">

        <h3>${producto.nombre}</h3>

        <p>
        <strong>
        $${producto.precio}
        </strong>
        </p>

        <button

        class="boton-carrito"

        onclick="agregarCarrito('${producto.nombre}','${producto.precio}','${producto.imagen}')">

        ➕ Agregar al carrito

        </button>

        </div>

        `;

    });

}


mostrarProductos(

    document.getElementById("paginaClientes").style.display = "block";

// =========================
//      GUARDAR CLIENTE
// =========================

document.getElementById("guardarCliente").onclick = function(){

    let nombre =
        document.getElementById("nombreCliente").value.trim();

    let whatsapp =
        document.getElementById("whatsappCliente").value.replace(/\D/g, "");

   if(nombre === ""){

    alert("Por favor escribe el nombre del cliente.");

    return;
}

    let clientes =
        JSON.parse(localStorage.getItem("clientesCODMAR")) || [];
       
      let clienteExistente = clientes.find(function(cliente){

    return cliente.nombre.toLowerCase() === nombre.toLowerCase();

});
    
    if(clienteExistente){

        alert("Este número de WhatsApp ya está registrado.");

        return;
    }

    // AGREGAR NUEVO CLIENTE

    clientes.push({
        nombre: nombre,
        whatsapp: whatsapp
    });

    // GUARDAR LA LISTA ACTUALIZADA

    localStorage.setItem(
        "clientesCODMAR",
        JSON.stringify(clientes)
    );

    // ACTUALIZAR LA LISTA EN PANTALLA

    mostrarClientes();

    // OCULTAR FORMULARIO

    document.getElementById("formularioCliente").style.display = "none";

    // LIMPIAR CAMPOS

    document.getElementById("nombreCliente").value = "";

    document.getElementById("whatsappCliente").value = "";

    alert("Cliente guardado correctamente.");

};



// =========================
//    MOSTRAR CLIENTES
// =========================

function mostrarClientes(){

    let clientes = JSON.parse(localStorage.getItem("clientesCODMAR")) || [];

    let lista = document.getElementById("listaClientes");

    lista.innerHTML = "";

    if(clientes.length === 0){

        lista.innerHTML =
        "<p style='text-align:center;'>No hay clientes registrados.</p>";

        return;
    }

    clientes.forEach(function(cliente, indice){

        lista.innerHTML += `

        <div style="
            margin:15px auto;
            padding:15px;
            max-width:500px;
            background:white;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
        ">

            <h3 style="margin:0;">
                👤 ${cliente.nombre}
            </h3>

            <p style="margin:8px 0;">
                📱 ${cliente.whatsapp}
            </p>

            <button onclick="seleccionarCliente(${indice})"
                style="
                    background:#0d6efd;
                    color:white;
                    border:none;
                    border-radius:6px;
                    padding:8px 15px;
                    cursor:pointer;
                    margin-right:8px;
                ">
                👤 Seleccionar
            </button>

            <button onclick="eliminarCliente(${indice})"
                style="
                    background:#d32f2f;
                    color:white;
                    border:none;
                    border-radius:6px;
                    padding:8px 15px;
                    cursor:pointer;
                ">
                🗑️ Eliminar
            </button>

        </div>

        `;

    });

}
// =========================
//     ELIMINAR CLIENTE
// =========================

function eliminarCliente(indice){

    let clientes = JSON.parse(localStorage.getItem("clientesCODMAR")) || [];

    let cliente = clientes[indice];

    if(!cliente){
        return;
    }

    let confirmar = confirm(
        "¿Quieres eliminar a " + cliente.nombre + "?"
    );

    if(!confirmar){
        return;
    }

    clientes.splice(indice, 1);

    localStorage.setItem(
        "clientesCODMAR",
        JSON.stringify(clientes)
    );

    mostrarClientes();

}



// =========================
//   SELECCIONAR CLIENTE
// =========================

function seleccionarCliente(indice){

    let clientes = JSON.parse(localStorage.getItem("clientesCODMAR")) || [];

    let cliente = clientes[indice];

    if(!cliente){
        return;
    }

    localStorage.setItem(
        "clienteSeleccionadoCODMAR",
        JSON.stringify(cliente)
    );

    alert(
        "Cliente seleccionado: " + cliente.nombre
    );

    document.getElementById("paginaClientes").style.display = "none";

    document.getElementById("paginaCarrito").style.display = "block";

    verCarrito();
}

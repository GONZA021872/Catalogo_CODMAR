<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO D MAR</title>

    <link rel="stylesheet" href="style.css">
</head>


 <body>

<!-- ACCESO DE USUARIO -->
<div id="pantalla-login">

    <h2>ACCESO</h2>

    <input
        type="email"
        id="login-email"
        placeholder="Correo electrónico">

    <input
        type="password"
        id="login-password"
        placeholder="Contraseña">

    <button
        type="button"
        id="boton-login">
        INICIAR SESIÓN
    </button>

    <div id="mensaje-login"></div>

</div>


<div id="pagina-inicio">
 
 
   <!-- FRANJA SUPERIOR -->  
<div class="barra-inicio-superior cargando"> 

    <button class="boton-menu" id="boton-menu"> 
        ☰ Menú 
    </button>

    <div class="buscador" id="buscador">  

        <button class="boton-busqueda" id="boton-busqueda">  
            🔍  
        </button>  

        <input  
            type="text"  
            id="campo-busqueda"  
            placeholder="Buscar..."  
        >  

    </div>  

   <button class="boton-carrito" aria-label="Carrito">

    <span
        class="bolsita"
        id="icono-bolsita"
    ></span>

    <span
        class="icono-carrito"
        id="icono-carrito"
    ></span>

</button>

</div>

<!-- ESPACIO CENTRAL -->  
<div class="contenido-inicio">  
</div>  

<!-- FRANJA INFERIOR -->  
<div class="barra-inicio-inferior">  
</div>  

<!-- MENÚ DESPLEGABLE -->
<div class="panel-menu" id="panel-menu">

    <div class="opcion-menu">
        Inicio
    </div>

    <div class="opcion-menu">
        Encabezado
    </div>

    <div class="opcion-menu">
        Configuración
    </div>

</div>


<!-- CONFIGURACIÓN DE INICIO -->
<div class="formulario-inicio" id="formulario-inicio">

    <h2>CONFIGURACIÓN DE INICIO</h2>

    <div class="opcion-color">
        <label>Color de franjas</label>
        <input type="color" id="color-franjas" value="#18a69f">
    </div>

    <div class="opcion-color">
        <label>Color del botón Menú</label>
        <input type="color" id="color-boton-menu" value="#159c96">
    </div>

    <div class="opcion-color">
        <label>Color del texto Menú</label>
        <input type="color" id="color-texto-menu" value="#f2f2f2">
    </div>

    <div class="opcion-color">
        <label>Color del menú desplegable</label>
        <input type="color" id="color-panel-menu" value="#D8E2EE">
    </div>

    <button id="aceptar-inicio">
        ACEPTAR
    </button>

</div>

<!-- CONFIGURACIÓN DE ENCABEZADO -->

<div class="formulario-inicio" id="formulario-cabecera">

    <h2>CONFIGURACIÓN DE ENCABEZADO</h2>

    <div class="opcion-encabezado">
        <button type="button" id="boton-configurar-logotipo">
            CONFIGURAR LOGOTIPO
        </button>
    </div>

    <div class="opcion-encabezado">
        <button type="button" id="boton-nombre-comercial">
            MOSTRAR NOMBRE COMERCIAL
        </button>
    </div>

    <div class="opcion-encabezado">
        <button type="button" id="boton-configurar-carrito">
            MOSTRAR CARRITO
        </button>
    </div>

    <div class="opcion-encabezado">
        <label>
            Mostrar buscador
            <input type="checkbox" id="mostrar-buscador" checked>
        </label>
    </div>

    <button id="aceptar-cabecera">
        ACEPTAR
    </button>

</div>

<!-- CONFIGURACIÓN DEL CARRITO -->

<div class="formulario-inicio" id="formulario-carrito">

    <h2>CONFIGURACIÓN DEL CARRITO</h2>

    <div class="opcion-encabezado">

        <label>
            Mostrar carrito
            <input
                type="checkbox"
                id="mostrar-carrito"
                checked>
        </label>

    </div>

    <div class="opciones-tipo-carrito">

        <label>
            <input
                type="radio"
                name="tipo-carrito"
                id="tipo-bolsita"
                value="bolsita"
                checked>
            Bolsita
        </label>

        <label>
            <input
                type="radio"
                name="tipo-carrito"
                id="tipo-carrito"
                value="carrito">
            Carrito
        </label>

    </div>

    <div class="opcion-encabezado posicion-carrito-control">

        <label>
            Posición del carrito
        </label>

        <div class="control-posicion-carrito">

            <button
                type="button"
                id="flecha-carrito-arriba">
                ▲
            </button>

            <button
                type="button"
                id="flecha-carrito-izquierda">
                ◀
            </button>

            <button
                type="button"
                id="centro-carrito">
            </button>

            <button
                type="button"
                id="flecha-carrito-derecha">
                ▶
            </button>

            <button
                type="button"
                id="flecha-carrito-abajo">
                ▼
            </button>

        </div>

    </div>

    <button id="aceptar-carrito">
        ACEPTAR
    </button>

</div>

<!-- CONFIGURACIÓN DEL LOGOTIPO -->

<div class="formulario-inicio" id="formulario-logotipo">

    <h2>CONFIGURACIÓN DEL LOGOTIPO</h2>

    <div class="opcion-encabezado">
        <label>Mostrar logotipo</label>
        <input type="checkbox" id="mostrar-logotipo" checked>
    </div>

    <div class="opcion-encabezado">
        <button type="button" id="boton-logotipo">
            SELECCIONAR ARCHIVO
        </button>

        <input
            type="file"
            id="archivo-logotipo"
            accept="image/*"
            hidden>
    </div>

    <div id="vista-logotipo">
        Ningún archivo seleccionado
    </div>

    <div class="opcion-encabezado posicion-logotipo-control">

    <label>Posición del logotipo</label>

    <div class="control-flechas-logotipo">

        <button
            type="button"
            id="flecha-logotipo-izquierda"
            aria-label="Mover logotipo a la izquierda">
            ◀
        </button>

        <span id="valor-ajuste-logotipo">Centro</span>

        <button
            type="button"
            id="flecha-logotipo-derecha"
            aria-label="Mover logotipo a la derecha">
            ▶
        </button>
</div>

</div>
    
    <button id="aceptar-logotipo">
        ACEPTAR
    </button>

</div>



<div class="formulario-inicio" id="formulario-nombre-comercial">

    <h2>CONFIGURACIÓN DEL NOMBRE COMERCIAL</h2>

    <div class="opcion-encabezado">
        <label>Nombre comercial</label>
        <input
            type="text"
            id="nombre-comercial"
            placeholder="Escribe el nombre de tu negocio">
    </div>

<div class="opcion-encabezado">
    <label>Tipo de letra</label>

    <select id="fuente-nombre-comercial">
        <option value="Arial">Arial</option>
        <option value="Calibri">Calibri</option>
        <option value="Cambria">Cambria</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Georgia">Georgia</option>
        <option value="Verdana">Verdana</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Trebuchet MS">Trebuchet MS</option>
        <option value="Courier New">Courier New</option>
        <option value="Lucida Console">Lucida Console</option>
        <option value="Impact">Impact</option>
        <option value="Comic Sans MS">Comic Sans MS</option>
        <option value="Arial Narrow">Arial Narrow</option>
        <option value="Franklin Gothic Medium">Franklin Gothic Medium</option>
        <option value="Garamond">Garamond</option>
        <option value="Book Antiqua">Book Antiqua</option>
        <option value="Century Gothic">Century Gothic</option>
        <option value="Palatino Linotype">Palatino Linotype</option>
        <option value="Segoe UI">Segoe UI</option>
        <option value="Roboto">Roboto</option>
        <option value="Open Sans">Open Sans</option>
        <option value="Montserrat">Montserrat</option>
        <option value="Poppins">Poppins</option>
    </select>
</div>

<div class="opcion-encabezado">
    <label>Tamaño de letra</label>

   <select id="tamano-nombre-comercial">
    <option value="14px">14</option>
    <option value="16px">16</option>
    <option value="18px">18</option>
    <option value="20px">20</option>
    <option value="24px">24</option>
    <option value="28px">28</option>
    <option value="32px">32</option>
    <option value="36px">36</option>
    <option value="40px">40</option>
    <option value="48px">48</option>
    <option value="56px">56</option>
    <option value="64px">64</option>
    <option value="72px">72</option>
    <option value="80px">80</option>
    <option value="96px">96</option>
    <option value="112px">112</option>
    <option value="128px">128</option>
</select>

</div>

<div class="opcion-encabezado posicion-nombre-comercial-control">

    <label>Posición del nombre comercial</label>

    <div class="control-posicion-nombre-comercial">

        <button
            type="button"
            id="flecha-nombre-comercial-arriba"
            aria-label="Subir nombre comercial">
            ▲
        </button>

        <button
            type="button"
            id="flecha-nombre-comercial-izquierda"
            aria-label="Mover nombre comercial a la izquierda">
            ◀
        </button>

        <span id="centro-nombre-comercial">
            Centro
        </span>

        <button
            type="button"
            id="flecha-nombre-comercial-derecha"
            aria-label="Mover nombre comercial a la derecha">
            ▶
        </button>

        <button
            type="button"
            id="flecha-nombre-comercial-abajo"
            aria-label="Bajar nombre comercial">
            ▼
        </button>

    </div>

</div>

<div class="opcion-encabezado mostrar-nombre-comercial">
    <label>Mostrar nombre comercial</label>
    <input
        type="checkbox"
        id="mostrar-nombre-comercial"
        checked>
</div>

<button id="aceptar-nombre-comercial">ACEPTAR</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
